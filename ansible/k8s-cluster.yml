---
- name: Prepare all nodes (master + workers)
  hosts: all
  gather_facts: yes
  vars:
    pod_cidr: "192.168.0.0/16"   # Calico-friendly
    kubernetes_apt_key_url: "https://packages.cloud.google.com/apt/doc/apt-key.gpg"
    calico_manifest_url: "https://raw.githubusercontent.com/projectcalico/calico/v3.31.0/manifests/calico.yaml"
  tasks:
    - name: Ensure swap is off (temporary)
      ansible.builtin.command: swapoff -a
      become: true
      changed_when: false

    - name: Comment out swap in /etc/fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#\n].*\s+swap\s+.*)$'
        replace: '# \\1'
        backup: yes

    - name: Ensure kernel modules are loaded now
      ansible.builtin.modprobe:
        name: "{{ item }}"
      loop:
        - overlay
        - br_netfilter

    - name: Ensure modules are loaded on boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        mode: '0644'

    - name: Ensure sysctl params for k8s
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kubernetes-cri.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.ipv4.ip_forward                 = 1
          net.bridge.bridge-nf-call-ip6tables = 1
        mode: '0644'

    - name: Reload sysctl
      ansible.builtin.command: sysctl --system
      register: sysctl_out
      changed_when: "'kernel' in sysctl_out.stdout or sysctl_out.rc == 0"

    - name: Update apt and install prerequisites
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: Install containerd
      ansible.builtin.apt:
        name: containerd
        state: latest
        update_cache: yes

    - name: Ensure /etc/containerd exists
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        mode: '0755'

    - name: Create containerd default config
      ansible.builtin.command: containerd config default
      register: containerd_default
      changed_when: false
      failed_when: containerd_default.rc != 0 and containerd_default.rc != 1
      # Some distros return 0, some 1; we only want stdout

    - name: Install containerd config file (idempotent)
      ansible.builtin.copy:
        dest: /etc/containerd/config.toml
        content: "{{ containerd_default.stdout }}"
        mode: '0644'
      when: containerd_default.stdout is defined and containerd_default.stdout != ""

    - name: Ensure SystemdCgroup = true in containerd config
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: '(\s*SystemdCgroup\s*=\s*)false'
        replace: '\1true'
      notify: Restart containerd

    - name: Ensure containerd service running & enabled
      ansible.builtin.systemd:
        name: containerd
        state: started
        enabled: yes

    - name: Create apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download and add Kubernetes repository GPG key
      ansible.builtin.shell: |
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.30/deb/Release.key | \
        gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      register: key_result
      changed_when: "'added' in key_result.stdout or key_result.rc == 0"

    - name: Add Kubernetes repository
      ansible.builtin.shell: |
        echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] \
        https://pkgs.k8s.io/core:/stable:/v1.30/deb/ /" | \
        tee /etc/apt/sources.list.d/kubernetes.list
      args:
        creates: /etc/apt/sources.list.d/kubernetes.list
      register: repo_result
      changed_when: "'added' in repo_result.stdout or repo_result.rc == 0"


    - name: Update package list
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install kubelet, kubeadm, kubectl
      ansible.builtin.apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: yes
      register: kube_install
      until: kube_install is succeeded
      retries: 5
      delay: 10

    - name: Hold kube packages
      ansible.builtin.command: apt-mark hold kubelet kubeadm kubectl
      changed_when: false

    - name: Wait for any running apt processes to finish
      ansible.builtin.wait_for:
        path: /var/lib/apt/daily-upgrade.lock
        state: absent
        timeout: 300
      ignore_errors: yes

    - name: Ensure kubelet is enabled (it may be started by kubeadm later)
      ansible.builtin.systemd:
        name: kubelet
        enabled: yes
        state: started
      ignore_errors: yes

  handlers:
    - name: Restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted

- name: Initialize master (only master host)
  hosts: master
  become: true
  gather_facts: yes
  vars:
    pod_cidr: "192.168.0.0/16"
    calico_manifest_url: "https://docs.projectcalico.org/manifests/calico.yaml"
  tasks:
    - name: Init kubeadm control plane (only if not already init)
      ansible.builtin.command: >
        kubeadm init --apiserver-advertise-address={{ ansible_default_ipv4.address }}
                   --pod-network-cidr={{ pod_cidr }}
      args:
        creates: /etc/kubernetes/admin.conf
      register: kubeadm_init
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Create .kube directory for ubuntu user (control user)
      ansible.builtin.file:
        path: /home/{{ ansible_user }}/.kube
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0700'

    - name: Copy admin kubeconfig to user
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/{{ ansible_user }}/.kube/config
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'
        remote_src: yes

    - name: Wait for API server to be ready
      ansible.builtin.shell: |
        until kubectl cluster-info &>/dev/null; do
          echo "Waiting for API server..."
          sleep 5
        done
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      retries: 12
      delay: 5

    - name: Apply Calico CNI manifest
      ansible.builtin.command: kubectl apply -f {{ calico_manifest_url }} --validate=false
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: calico_apply
      retries: 3
      delay: 5
      until: calico_apply.rc == 0

    - name: Wait for kubernetes system pods to be ready
      ansible.builtin.command: kubectl wait --for=condition=Ready pods --all -n kube-system --timeout=180s
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: wait_output
      failed_when: false

    - name: Wait for API server to stabilize after pod deployment
      ansible.builtin.shell: |
        until kubectl get nodes &>/dev/null; do
          echo "Waiting for API server to stabilize..."
          sleep 5
        done
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      retries: 12
      delay: 5

    - name: Generate join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join_cmd
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      retries: 5
      delay: 10
      until: join_cmd is succeeded

    - name: Save join command to file (for workers)
      ansible.builtin.copy:
        dest: /tmp/kube_join_cmd.sh
        content: |
          #!/bin/sh
          {{ join_cmd.stdout }}
        mode: '0700'

    - name: Show join command (for debug)
      ansible.builtin.debug:
        msg: "{{ join_cmd.stdout }}"

- name: Join workers to the cluster
  hosts: workers
  become: true
  gather_facts: yes
  tasks:
    - name: Wait for join command file to be created on master
      ansible.builtin.wait_for:
        path: /tmp/kube_join_cmd.sh
        state: present
        timeout: 300
      delegate_to: "{{ groups['master'][0] }}"

    - name: Fetch join command from master
      ansible.builtin.slurp:
        src: /tmp/kube_join_cmd.sh
      delegate_to: "{{ groups['master'][0] }}"
      register: join_script_b64

    - name: Write join script locally on worker
      ansible.builtin.copy:
        dest: /tmp/kube_join_cmd.sh
        content: "{{ join_script_b64.content | b64decode }}"
        mode: '0700'

    - name: Run kubeadm join (idempotent)
      ansible.builtin.command: sh /tmp/kube_join_cmd.sh
      args:
        creates: /etc/kubernetes/kubelet.conf
      register: join_result
      retries: 5
      delay: 30
      until: join_result.rc == 0 or 'already a member of the cluster' in join_result.stdout
      failed_when: join_result.rc != 0 and 'already a member of the cluster' not in join_result.stdout

    - name: Ensure kubelet is running
      ansible.builtin.systemd:
        name: kubelet
        state: started
        enabled: yes

