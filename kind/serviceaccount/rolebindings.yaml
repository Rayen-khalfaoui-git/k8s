apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-binding
  namespace: microservices-demo
subjects:
- kind: ServiceAccount
  name: backend-sa
  namespace: microservices-demo
roleRef:
  kind: Role
  name: backend-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: frontend-binding
  namespace: microservices-demo
subjects:
- kind: ServiceAccount
  name: frontend-sa
  namespace: microservices-demo
roleRef:
  kind: Role
  name: frontend-role
  apiGroup: rbac.authorization.k8s.io