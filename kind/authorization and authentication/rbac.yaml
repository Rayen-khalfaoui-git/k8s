# Role: Defines permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: default
  name: pod-viewer
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]  # Can view but NOT create/delete
---
# RoleBinding: Gives Role to Adam
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: default
  name: adam-can-view-pods
subjects:
- kind: User
  name: adam            # Matches certificate's CN
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: pod-viewer